<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Литийная Дуга</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== МЕНЮ ===== -->
  <div id="menu" class="screen">
    <div class="menu-container">
      <div class="header">
        <h1 class="game-title" data-i18n="gameTitle">ЛИТИЙНАЯ ДУГА</h1>
        <p class="game-subtitle" data-i18n="gameSubtitle">Стратегия в реальном времени за ресурс будущего</p>
      </div>

      <div class="menu-section">
        <div class="section-label"><span class="dot"></span><span data-i18n="language">ЯЗЫК · LANGUAGE</span></div>
        <div class="row">
          <button class="opt-btn lang-btn selected" data-lang="ru">Русский</button>
          <button class="opt-btn lang-btn" data-lang="en">English</button>
        </div>
      </div>

      <div class="menu-section">
        <div class="section-label"><span class="dot"></span><span data-i18n="faction">СТОРОНА</span></div>
        <div class="row faction-row">
          <div class="faction-card" data-faction="aurora">
            <div class="faction-name" data-i18n="auroraName">Республика Аврора</div>
          </div>
          <div class="faction-card" data-faction="vesper">
            <div class="faction-name" data-i18n="vesperName">Доминион Веспер</div>
          </div>
        </div>
      </div>

      <div class="menu-section">
        <div class="section-label"><span class="dot"></span><span data-i18n="difficulty">СЛОЖНОСТЬ</span></div>
        <div class="row">
          <button class="opt-btn diff-btn" data-diff="easy" data-i18n="easy">Легко</button>
          <button class="opt-btn diff-btn selected" data-diff="normal" data-i18n="normal">Норма</button>
          <button class="opt-btn diff-btn" data-diff="hard" data-i18n="hard">Сложно</button>
          <button class="opt-btn diff-btn" data-diff="insane" data-i18n="insane">Хардкор</button>
        </div>
        <div id="difficulty-desc" class="difficulty-desc"></div>
      </div>

      <button id="start-btn" disabled>
        <span data-i18n="startGame">НАЧАТЬ ИГРУ</span>
      </button>
    </div>
  </div>

  <!-- ===== ИГРА ===== -->
  <div id="game-screen" class="screen hidden">
    <div id="hud">
      <div class="hud-row resources">
        <div class="stat">
          <span class="icon">💰</span>
          <div class="stat-body">
            <span class="value" id="money">0</span>
            <span class="sub" id="income">+0.0/с</span>
          </div>
        </div>
        <div class="stat"><span class="icon">👥</span><span class="value" id="population">0</span></div>
        <div class="stat"><span class="icon">😊</span><span class="value" id="satisfaction">0%</span></div>
        <div class="stat"><span class="icon">🕳️</span><span class="value" id="corruption">0%</span></div>
      </div>
      <div class="hud-row controls-row">
        <div class="speed-group">
          <button class="speed-btn" data-speed="1">×1</button>
          <button class="speed-btn" data-speed="2">×2</button>
          <button class="speed-btn" data-speed="4">×4</button>
        </div>
        <div class="speed-group">
          <button class="zoom-btn" id="zoom-out">−</button>
          <button class="zoom-btn" id="zoom-in">+</button>
          <button class="city-btn" id="city-list-btn">🏙️</button>
          <button id="pause-btn">⏸</button>
        </div>
      </div>
    </div>
    <canvas id="game"></canvas>

    <div id="city-panel" class="city-panel hidden">
      <div class="city-panel-header">
        <span id="city-panel-name">Город</span>
        <button id="city-panel-close">✕</button>
      </div>
      <div class="city-panel-body">
        <div class="city-stat"><span data-i18n="cityOwner">Владелец:</span><span id="city-owner">—</span></div>
        <div class="city-stat"><span data-i18n="cityType">Тип:</span><span id="city-type">—</span></div>
        <div class="city-stat"><span data-i18n="cityGarrison">Гарнизон:</span><span id="city-garrison">0</span></div>
        <div class="city-stat"><span data-i18n="cityInfra">Инфраструктура:</span><span id="city-infra">0%</span></div>
        <div class="city-stat"><span data-i18n="cityIncome">Доход:</span><span id="city-income">+0.0/с</span></div>
      </div>
      <div class="city-panel-actions">
        <button id="city-attack-btn" class="action-btn">⚔️ Наступление</button>
      </div>
    </div>

    <div id="attack-target-panel" class="city-panel hidden">
      <div class="city-panel-header">
        <span data-i18n="chooseTarget">Выберите цель</span>
        <button id="attack-target-close">✕</button>
      </div>
      <div class="city-panel-body" id="attack-targets"></div>
    </div>

    <div id="attack-sources-panel" class="city-panel hidden">
      <div class="city-panel-header">
        <span data-i18n="chooseSource">Откуда атаковать?</span>
        <button id="attack-sources-close">✕</button>
      </div>
      <div class="city-panel-body" id="attack-sources-list"></div>
    </div>

    <div id="gameover-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="gameover-title">Игра окончена</h2>
        <p id="gameover-text"></p>
        <button id="gameover-restart" data-i18n="backToMenu">В меню</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
