<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Литийная Дуга</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== МЕНЮ ===== -->
  <div id="menu" class="screen">
    <div class="menu-container">

      <!-- Заголовок -->
      <div class="header">
        <h1 class="game-title" data-i18n="gameTitle">ЛИТИЙНАЯ ДУГА</h1>
        <p class="game-subtitle" data-i18n="gameSubtitle">Стратегия в реальном времени за ресурс будущего</p>
      </div>

      <!-- Язык -->
      <div class="menu-section">
        <div class="section-label">
          <span class="dot"></span>
          <span data-i18n="language">ЯЗЫК · LANGUAGE</span>
        </div>
        <div class="row">
          <button class="opt-btn lang-btn selected" data-lang="ru">Русский</button>
          <button class="opt-btn lang-btn" data-lang="en">English</button>
        </div>
      </div>

      <!-- Сторона -->
      <div class="menu-section">
        <div class="section-label">
          <span class="dot"></span>
          <span data-i18n="faction">СТОРОНА</span>
        </div>
        <div class="row faction-row">
          <div class="faction-card" data-faction="aurora">
            <div class="faction-name" data-i18n="auroraName">Республика Аврора</div>
          </div>
          <div class="faction-card" data-faction="vesper">
            <div class="faction-name" data-i18n="vesperName">Доминион Веспер</div>
          </div>
        </div>
      </div>

      <!-- Сложность -->
      <div class="menu-section">
        <div class="section-label">
          <span class="dot"></span>
          <span data-i18n="difficulty">СЛОЖНОСТЬ</span>
        </div>
        <div class="row">
          <button class="opt-btn diff-btn" data-diff="easy" data-i18n="easy">Легко</button>
          <button class="opt-btn diff-btn selected" data-diff="normal" data-i18n="normal">Норма</button>
          <button class="opt-btn diff-btn" data-diff="hard" data-i18n="hard">Сложно</button>
          <button class="opt-btn diff-btn" data-diff="insane" data-i18n="insane">Хардкор</button>
        </div>
        <div id="difficulty-desc" class="difficulty-desc"></div>
      </div>

      <!-- Старт -->
      <button id="start-btn" disabled>
        <span data-i18n="startGame">НАЧАТЬ ИГРУ</span>
      </button>
    </div>
  </div>

  <!-- ===== ИГРА ===== -->
  <div id="game-screen" class="screen hidden">
    <div id="hud">
      <div class="hud-row resources">
        <div class="stat">
          <span class="icon">💰</span>
          <div class="stat-body">
            <span class="value" id="money">0</span>
            <span class="sub" id="income">+0.0/с</span>
          </div>
        </div>
        <div class="stat">
          <span class="icon">👥</span>
          <span class="value" id="population">0</span>
        </div>
        <div class="stat">
          <span class="icon">😊</span>
          <span class="value" id="satisfaction">0%</span>
        </div>
        <div class="stat">
          <span class="icon">🕳️</span>
          <span class="value" id="corruption">0%</span>
        </div>
      </div>

      <div class="hud-row controls-row">
        <div class="speed-group">
          <button class="speed-btn" data-speed="1">×1</button>
          <button class="speed-btn" data-speed="2">×2</button>
          <button class="speed-btn" data-speed="4">×4</button>
        </div>
        <button id="pause-btn">⏸</button>
      </div>
    </div>
    <canvas id="game"></canvas>
  </div>

  <script src="game.js"></script>
</body>
</html>
